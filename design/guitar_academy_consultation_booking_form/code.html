<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Guitar Academy - Book Consultation</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&amp;family=Montserrat:wght@700;900&amp;family=Space+Grotesk:wght@700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed-variant": "#005232",
                        "surface-bright": "#343a39",
                        "surface-container-low": "#171d1c",
                        "surface-dim": "#0f1513",
                        "surface-tint": "#00e293",
                        "surface-container-highest": "#303635",
                        "secondary-fixed-dim": "#ffb956",
                        "on-secondary": "#452b00",
                        "tertiary-container": "#c8dbd6",
                        "secondary": "#ffb956",
                        "primary-fixed-dim": "#00e293",
                        "surface-container-lowest": "#090f0e",
                        "on-tertiary-container": "#4f615d",
                        "on-tertiary-fixed": "#0e1f1c",
                        "surface-container": "#1b2120",
                        "error": "#ffb4ab",
                        "tertiary-fixed": "#d3e7e1",
                        "error-container": "#93000a",
                        "on-secondary-fixed": "#2a1800",
                        "on-primary-fixed": "#002111",
                        "secondary-fixed": "#ffddb5",
                        "on-tertiary": "#233430",
                        "surface": "#0f1513",
                        "on-secondary-fixed-variant": "#633f00",
                        "on-primary-container": "#006b43",
                        "on-background": "#dee4e1",
                        "inverse-surface": "#dee4e1",
                        "on-error": "#690005",
                        "surface-container-high": "#252b2a",
                        "primary-container": "#00f5a0",
                        "tertiary": "#e4f8f2",
                        "on-tertiary-fixed-variant": "#394a46",
                        "primary-fixed": "#50ffaf",
                        "background": "#0f1513",
                        "tertiary-fixed-dim": "#b7cbc5",
                        "secondary-container": "#c58311",
                        "outline-variant": "#3b4a40",
                        "on-secondary-container": "#3d2500",
                        "on-surface-variant": "#b9cbbd",
                        "inverse-on-surface": "#2b3230",
                        "on-error-container": "#ffdad6",
                        "surface-variant": "#303635",
                        "on-surface": "#dee4e1",
                        "outline": "#849588",
                        "primary": "#cdffde",
                        "inverse-primary": "#006c44",
                        "on-primary": "#003921"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "section-gap": "80px",
                        "container-padding-mobile": "20px",
                        "unit": "8px",
                        "gutter": "24px",
                        "container-padding-desktop": "48px"
                    },
                    "fontFamily": {
                        "body-md": ["Be Vietnam Pro"],
                        "display-lg": ["Montserrat"],
                        "headline-sm": ["Montserrat"],
                        "headline-md": ["Montserrat"],
                        "label-caps": ["Space Grotesk"],
                        "body-lg": ["Be Vietnam Pro"],
                        "display-lg-mobile": ["Montserrat"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "display-lg": ["64px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "900" }],
                        "headline-sm": ["24px", { "lineHeight": "1.4", "fontWeight": "700" }],
                        "headline-md": ["32px", { "lineHeight": "1.3", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "display-lg-mobile": ["36px", { "lineHeight": "1.2", "fontWeight": "900" }]
                    }
                }
            }
        }
    </script>
<style>
        .bloom-shadow-primary {
            box-shadow: 0 0 15px 0 rgba(0, 226, 147, 0.4);
        }
        .bloom-shadow-secondary:hover {
            box-shadow: 0 0 15px 0 rgba(255, 185, 86, 0.4);
        }
        .glass-card {
            background-color: rgba(11, 20, 18, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid #1A2C29;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05); /* top light */
        }
        .input-glow:focus-within {
            border-bottom-color: #00e293;
            box-shadow: 0 1px 0 0 #00e293;
        }
        .time-slot-radio:checked + label {
            border-color: #00e293;
            background-color: rgba(0, 226, 147, 0.1);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 0 10px 0 rgba(0, 226, 147, 0.2);
        }
        .time-slot-radio:checked + label .time-text {
            color: #00e293;
        }
        
        /* Subtle background radial gradient for Level 0 */
        body {
            background-image: radial-gradient(circle at 50% 0%, rgba(30, 45, 40, 0.5) 0%, transparent 60%);
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-md overflow-x-hidden antialiased">
<!-- TopAppBar from JSON -->
<header class="docked full-width top-0 sticky z-50 bg-surface/80 backdrop-blur-md transition-all duration-300 ease-in-out">
<div class="flex justify-between items-center w-full px-container-padding-mobile md:px-gutter max-w-7xl mx-auto h-16">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" style="font-variation-settings: 'FILL' 1;">music_note</span>
</div>
<div class="font-headline-md text-headline-md font-bold tracking-tight text-primary dark:text-primary-fixed-dim">
                GUITAR ACADEMY
            </div>
<button class="text-primary dark:text-primary-fixed-dim hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined">menu</span>
</button>
</div>
</header>
<main class="flex-grow flex flex-col items-center justify-center px-container-padding-mobile md:px-container-padding-desktop py-section-gap relative">
<div class="w-full max-w-3xl glass-card rounded-2xl p-6 md:p-12 relative overflow-hidden">
<!-- Decorative radial behind content inside card -->
<div class="absolute -top-32 -left-32 w-64 h-64 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="relative z-10 flex flex-col items-center text-center mb-10">
<div class="inline-flex items-center gap-2 px-3 py-1 bg-surface-container-highest rounded-full mb-6 border border-outline-variant">
<span class="w-2 h-2 rounded-full bg-secondary bloom-shadow-secondary"></span>
<span class="font-label-caps text-label-caps text-secondary uppercase">Final Step</span>
</div>
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-on-surface mb-4">
                    Book Your Free Consultation
                </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-xl mx-auto">
                    Select a time that works for you to discuss your personalized 12-week roadmap.
                </p>
</div>
<form class="relative z-10 space-y-8 w-full">
<!-- Contact Info Section -->
<div class="space-y-4">
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-2 flex items-center gap-2">
<span class="material-symbols-outlined text-primary">person</span>
                        Contact Details
                    </h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="relative">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2 uppercase" for="fullName">Full Name</label>
<div class="relative input-glow border-b border-outline-variant transition-colors duration-200">
<input class="w-full bg-surface-dim/50 border-none px-4 py-3 text-on-surface placeholder-on-surface-variant/40 focus:ring-0 font-body-md text-body-md rounded-t-DEFAULT" id="fullName" placeholder="John Doe" type="text"/>
</div>
</div>
<div class="relative">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2 uppercase" for="phone">Phone Number</label>
<div class="relative input-glow border-b border-outline-variant transition-colors duration-200">
<input class="w-full bg-surface-dim/50 border-none px-4 py-3 text-on-surface placeholder-on-surface-variant/40 focus:ring-0 font-body-md text-body-md rounded-t-DEFAULT" id="phone" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</div>
</div>
</div>
<!-- Time Slot Section -->
<div class="space-y-4 pt-4 border-t border-surface-variant">
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-2 flex items-center gap-2">
<span class="material-symbols-outlined text-primary">calendar_month</span>
                        Available Time Slots
                    </h2>
<div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
<!-- Slot 1 -->
<div class="relative group">
<input checked="" class="peer sr-only time-slot-radio" id="slot1" name="timeSlot" type="radio"/>
<label class="flex flex-col items-center justify-center p-4 bg-surface-container rounded-xl border border-surface-variant cursor-pointer transition-all duration-200 hover:border-outline-variant" for="slot1">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-1">Monday</span>
<span class="time-text font-headline-sm text-headline-sm text-on-surface font-bold transition-colors">10:00 AM</span>
</label>
</div>
<!-- Slot 2 -->
<div class="relative group">
<input class="peer sr-only time-slot-radio" id="slot2" name="timeSlot" type="radio"/>
<label class="flex flex-col items-center justify-center p-4 bg-surface-container rounded-xl border border-surface-variant cursor-pointer transition-all duration-200 hover:border-outline-variant" for="slot2">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-1">Tuesday</span>
<span class="time-text font-headline-sm text-headline-sm text-on-surface font-bold transition-colors">2:00 PM</span>
</label>
</div>
<!-- Slot 3 -->
<div class="relative group">
<input class="peer sr-only time-slot-radio" id="slot3" name="timeSlot" type="radio"/>
<label class="flex flex-col items-center justify-center p-4 bg-surface-container rounded-xl border border-surface-variant cursor-pointer transition-all duration-200 hover:border-outline-variant" for="slot3">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-1">Thursday</span>
<span class="time-text font-headline-sm text-headline-sm text-on-surface font-bold transition-colors">4:30 PM</span>
</label>
</div>
</div>
</div>
<!-- Submit Action -->
<div class="pt-8 flex justify-center w-full">
<button class="group relative flex items-center justify-center gap-2 bg-gradient-to-r from-primary to-primary-fixed-dim text-on-primary font-headline-sm text-headline-sm px-8 py-4 rounded-full bloom-shadow-primary hover:opacity-90 transition-all duration-300 w-full md:w-auto overflow-hidden" type="button">
<!-- Button inner glow highlight -->
<div class="absolute inset-0 bg-white/20 blur-md rounded-full transform -translate-y-1/2 opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="relative z-10 font-bold">Confirm My Booking</span>
<span class="material-symbols-outlined relative z-10 group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</form>
</div>
</main>
<!-- Suppressed BottomNavBar for transactional flow -->
</body></html>
