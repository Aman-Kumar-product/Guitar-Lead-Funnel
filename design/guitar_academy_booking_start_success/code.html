<!DOCTYPE html>

<html class="dark" lang="en"><head>

            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;

            border-top-right-radius: inherit;

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden relative selection:bg-primary selection:text-on-primary">
<!-- Ambient Background Glows -->
<div class="fixed inset-0 pointer-events-none z-0">
<div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-primary-container opacity-5 blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[60vw] h-[60vw] rounded-full bg-secondary-container opacity-5 blur-[150px]"></div>
<!-- Noise Texture Overlay (simulated with CSS pattern) -->
<div class="absolute inset-0 opacity-10 mix-blend-overlay" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');"></div>
</div>
<!-- TopAppBar -->
<header class="font-headline-sm text-headline-sm flex justify-between items-center w-full px-container-padding-mobile md:px-container-padding-desktop max-w-7xl mx-auto h-16 bg-surface dark:bg-surface text-primary dark:text-primary-fixed-dim docked full-width top-0 sticky z-50 bg-surface/80 backdrop-blur-md transition-all duration-300 ease-in-out">
<button aria-label="Menu" class="hover:opacity-80 transition-opacity flex items-center justify-center p-2 text-outline dark:text-outline-variant">
<span class="material-symbols-outlined" data-icon="music_note">music_note</span>
</button>
<div class="font-headline-md text-headline-md font-bold tracking-tight text-primary dark:text-primary-fixed-dim">
            GUITAR ACADEMY
        </div>
<button aria-label="Menu" class="hover:opacity-80 transition-opacity flex items-center justify-center p-2 text-outline dark:text-outline-variant">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center relative z-10 px-container-padding-mobile md:px-container-padding-desktop py-section-gap w-full max-w-3xl mx-auto text-center"><div class="w-full mb-8 p-4 rounded-xl bg-surface-container-high border border-primary/20 backdrop-blur-md flex items-center justify-center gap-3 animate-in fade-in slide-in-from-top-4 duration-500">
<span class="material-symbols-outlined text-primary" data-icon="check_circle">check_circle</span>
<p class="font-body-md text-primary font-bold tracking-wide">
        Your detailed result has been successfully sent to your mail!
    </p>
</div>

<div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-surface-container-high border border-outline-variant mb-8">
<span class="w-2 h-2 rounded-full bg-secondary bloom-shadow-secondary"></span>
<span class="font-label-caps text-label-caps text-on-surface uppercase tracking-widest">Limited Spots Available</span>
</div>
<!-- Headline -->
<h1 class="font-display-lg-mobile md:font-display-lg text-on-surface mb-6 drop-shadow-md">
            Ready to start your journey?
        </h1>
<!-- Value Proposition Card (Glassmorphism & Tactile Lighting) -->
<div class="w-full max-w-xl bg-surface/80 backdrop-blur-xl border border-surface-bright rounded-xl p-8 mb-12 shadow-2xl relative overflow-hidden card-top-light group hover:border-outline-variant transition-colors duration-500">
<!-- Internal Glow -->
<div class="absolute inset-0 bg-gradient-to-b from-primary/5 to-transparent pointer-events-none"></div>
<p class="font-body-lg text-body-lg text-on-surface-variant relative z-10">
                Get a personalized <span class="text-primary font-bold">12-week roadmap</span> and 1-on-1 expert guidance to unlock your true potential on the fretboard.
            </p>
</div>
<!-- Call to Actions -->
<div class="flex flex-col items-center gap-6 w-full">
<!-- Primary CTA (Adapted to vibrant orange/neon as requested, mapped to config tokens) -->
<button class="w-full md:w-auto px-8 py-4 rounded-full bg-secondary text-on-secondary font-headline-sm text-headline-sm font-bold tracking-wide bloom-shadow-secondary hover:-translate-y-1 transition-all duration-300 ease-out flex items-center justify-center gap-2 group">
                Book My FREE Consultation
                <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
<!-- Secondary Link -->
<button class="font-body-md text-body-md text-outline hover:text-primary transition-colors duration-300 underline-offset-4 hover:underline">
                Send Free Guitar Resources Instead
            </button>
</div>
</main>
